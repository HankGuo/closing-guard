[project]
name = "closing-guard"
version = "0.1.3"
description = "A local-first closing-safety agent for small shops, powered by MiniCPM-V 4.7 1B and MiniCPM-OCR 1.0."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Closing Guard contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pillow>=10.0",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "weasyprint>=62",
  "qrcode[pil]>=7.4",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: real end-to-end tests that require live MiniCPM model servers",
  "unit: fast tests that do not require model servers",
]
